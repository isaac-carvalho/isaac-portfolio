<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feuille d'Impression A4 — Tailleur Isaac Carvalho</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --sans: 'Outfit', sans-serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'Space Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: white;
  margin: 0;
  padding: 0;
}
.a4-page {
  width: 210mm;
  height: 297mm;
  padding: 11mm 15mm;
  display: grid;
  grid-template-columns: repeat(2, 90mm);
  grid-template-rows: repeat(5, 55mm);
  gap: 0;
  justify-content: center;
  align-content: center;
  box-sizing: border-box;
}
.card-wrapper {
  width: 90mm;
  height: 55mm;
  position: relative;
  box-sizing: border-box;
}
.card-wrapper::after {
  content: "";
  position: absolute;
  inset: -1px;
  border: 0.3px dashed #DDD;
  pointer-events: none;
}
.card-tailor {
  width: 100%;
  height: 100%;
  background: #FDFCF9;
  border: 1px solid #E2DAC4;
  padding: 5.5mm 6mm;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-sizing: border-box;
  position: relative;
}
.card-tailor::before {
  content: "";
  position: absolute;
  inset: 2mm;
  border: 0.5px solid #96722C;
  opacity: 0.4;
}
.tailor-header { display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
.tailor-brand { display: flex; flex-direction: column; max-width: 58mm; }
.tailor-eyebrow { font-family: var(--mono); font-size: 7.5px; color: #800000; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
.tailor-name { font-family: var(--serif); font-size: 21px; font-weight: 700; color: #1E231F; line-height: 1.1; }
.tailor-hook { font-family: var(--serif); font-size: 9px; italic; color: #6B624E; margin-top: 2px; line-height: 1.25; font-weight: 600; }

.tailor-details { display: flex; flex-direction: column; gap: 2.5px; z-index: 10; }
.tailor-item { font-size: 9px; color: #1E231F; display: flex; gap: 4px; align-items: center; }
.tailor-item strong { font-family: var(--mono); color: #800000; font-size: 7.5px; min-width: 14px; text-transform: uppercase; }

.qr-area { display: flex; flex-direction: column; align-items: center; gap: 2.5px; border-left: 0.8px solid #E2DAC4; padding-left: 3mm; }
.qr-box { width: 17mm; height: 17mm; background: white; padding: 1px; }
.qr-box svg { width: 100%; height: 100%; }
.qr-text { font-family: var(--mono); font-size: 5px; color: #800000; font-weight: 700; text-transform: uppercase; text-align: center; line-height: 1.1; }
</style>
</head>
<body>

    for(let i=0; i<10; i++) {
      document.write(`
        <div class="card-wrapper">

</div>
</body>
</html>
