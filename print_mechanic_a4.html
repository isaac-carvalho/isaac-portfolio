<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feuille d'Impression A4 — Mecanicien Isaac Carvalho</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --sans: 'Outfit', sans-serif;
  --mono: 'Space Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: white;
  margin: 0;
  padding: 0;
}
.a4-page {
  width: 210mm;
  height: 297mm;
  padding: 11mm 15mm;
  display: grid;
  grid-template-columns: repeat(2, 90mm);
  grid-template-rows: repeat(5, 55mm);
  gap: 0;
  justify-content: center;
  align-content: center;
  box-sizing: border-box;
}
.card-wrapper {
  width: 90mm;
  height: 55mm;
  position: relative;
  box-sizing: border-box;
}
.card-wrapper::after {
  content: "";
  position: absolute;
  inset: -1px;
  border: 0.3px dashed #DDD;
  pointer-events: none;
}
.card-mechanic {
  width: 100%;
  height: 100%;
  background: #1F2226;
  border: 1px solid #3D444F;
  padding: 5.5mm 6mm;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-sizing: border-box;
  position: relative;
}
.card-mechanic::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1.2mm;
  background: #D45B2E;
}
.mechanic-header { display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
.mechanic-brand { display: flex; flex-direction: column; max-width: 58mm; }
.mechanic-eyebrow { font-family: var(--mono); font-size: 7.5px; color: #C6923F; text-transform: uppercase; font-weight: 700; }
.mechanic-name { font-size: 20px; font-weight: 800; color: #F5F7FA; line-height: 1.1; letter-spacing: -0.01em; }
.mechanic-hook { font-size: 9px; color: #8D99AE; margin-top: 2px; line-height: 1.25; font-weight: 500; }

.mechanic-details { display: flex; flex-direction: column; gap: 2.5px; z-index: 10; }
.mechanic-item { font-size: 9px; color: #F5F7FA; display: flex; gap: 4px; align-items: center; }
.mechanic-item strong { font-family: var(--mono); color: #D45B2E; font-size: 7.5px; min-width: 14px; text-transform: uppercase; }

.qr-area { display: flex; flex-direction: column; align-items: center; gap: 2.5px; border-left: 0.8px solid #3D444F; padding-left: 3mm; }
.qr-box { width: 17mm; height: 17mm; background: white; padding: 1px; }
.qr-box svg { width: 100%; height: 100%; }
.qr-text { font-family: var(--mono); font-size: 5px; color: #D45B2E; font-weight: 700; text-transform: uppercase; text-align: center; line-height: 1.1; }
</style>
</head>
<body>
<div class="a4-page">
  <!-- 10 Cartões de Mecânico -->
  <script>
    const qrSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h29v29H0z"/><path stroke="#1E231F" d="M1 1.5h7m3 0h1m2 0h1m2 0h1m3 0h7M1 2.5h1m5 0h1m1 0h2m2 0h1m2 0h1m2 0h1m1 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m2 0h1m1 0h3m2 0h1m1 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m2 0h3m1 0h1m1 0h2m3 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m2 0h1m1 0h3m1 0h2m1 0h1m2 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m2 0h1m1 0h4m2 0h1m1 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m2 0h1m2 0h1m2 0h7M9 8.5h1m1 0h1m2 0h3m2 0h1M1 9.5h2m1 0h1m1 0h1m2 0h1m3 0h1m1 0h1m4 0h3m3 0h1M2 10.5h1m2 0h1m1 0h1m1 0h1m2 0h1m1 0h2m1 0h1m4 0h2m2 0h2M1 11.5h2m1 0h1m4 0h1m1 0h1m1 0h1m2 0h2m1 0h4m3 0h1M3 12.5h1m2 0h2m1 0h3m1 0h2m2 0h2m3 0h3m2 0h1M1 13.5h2m1 0h1m2 0h1m1 0h2m1 0h2m1 0h1m1 0h4m2 0h3m1 0h1M1 14.5h1m2 0h4m2 0h3m3 0h3m4 0h2m1 0h1M2 15.5h2m1 0h1m1 0h2m2 0h1m1 0h1m3 0h1m2 0h4m1 0h1M3 16.5h3m1 0h1m3 0h2m4 0h1m3 0h3m1 0h2M1 17.5h2m2 0h4m1 0h2m2 0h3m1 0h2m1 0h1m4 0h1M9 18.5h2m2 0h2m1 0h2m2 0h3m1 0h3M1 19.5h7m1 0h1m2 0h1m3 0h1m1 0h1m3 0h1m1 0h2m1 0h1M1 20.5h1m5 0h1m3 0h2m1 0h1m1 0h2m1 0h2m1 0h1m2 0h3m1 0h1M1 21.5h1m1 0h3m1 0h1m2 0h1m2 0h2m1 0h1m1 0h1m2 0h3m1 0h1m2 0h3M1 22.5h1m1 0h3m1 0h1m2 0h2m2 0h2m1 0h1m1 0h1m1 0h1m2 0h1m2 0h3M1 23.5h1m1 0h3m1 0h1m2 0h1m1 0h2m1 0h1m3 0h2m1 0h2m2 0h1m1 0h1M1 24.5h1m5 0h1m2 0h2m1 0h1m2 0h1m1 0h3m2 0h4m2 0h1M1 25.5h7m1 0h1m1 0h1m1 0h2m2 0h1m2 0h1m1 0h2m1 0h1m1 0h2"/></svg>`;
    for(let i=0; i<10; i++) {
      document.write(`
        <div class="card-wrapper">
          <div class="card-mechanic">
            <div class="mechanic-header">
              <div class="mechanic-brand">
                <span class="mechanic-eyebrow font-bold">Dépannage Rapide &amp; Garanti</span>
                <span class="mechanic-name">Isaac Carvalho</span>
                <span class="mechanic-hook">Votre machine ne coud plus ? Ne stoppez pas votre production. Intervention rapide.</span>
              </div>
              <div class="qr-area">
                <div class="qr-box">\${qrSvg}</div>
                <span class="qr-text">Dépannage<br>Urgent</span>
              </div>
            </div>
            <div class="mechanic-details">
              <div class="mechanic-item"><strong>SERVICES:</strong> <span style="font-weight: 700; color: #EA580C;">Singer, Brother, Industrielles &amp; Familiales · Toutes Marques</span></div>
              <div class="mechanic-item"><strong>MORADA:</strong> <span>Aurillac, Cantal (15) · Déplacement à domicile, atelier &amp; usine</span></div>
              <div class="mechanic-item"><strong>WhatsApp:</strong> <span style="font-weight: 700; color: #EA580C;">+33 6 73 10 28 01 (Diagnostic instantané 24h/24)</span></div>
            </div>
          </div>
        </div>
      `);
    }
  </script>
</div>
</body>
</html>
